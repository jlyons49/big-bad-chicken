# DEPRECATED: Automatic push-based SSH/rsync deployment to the persistent Linode VPS
# has been replaced by the centralized bundler & container workflow in `server-game-manager`
# (`python scripts/bundle_all.py` / Docker / Cloud Run).
#
# Automatic `on: push` triggers have been disabled so commits do not fail when
# the on-demand server is spun down.

name: "[DEPRECATED] Legacy SSH Deploy to Linode"

on:
  workflow_dispatch:
    inputs:
      confirm_legacy_deploy:
        description: "Type 'yes' to run legacy SSH rsync to a running server"
        required: true
        default: "no"

jobs:
  deploy:
    name: Legacy SSH Rsync (big-bad-chicken)
    if: ${{ github.event.inputs.confirm_legacy_deploy == 'yes' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Game to Server Subfolder
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST || 'game.heftyracoon.com' }}
          REMOTE_USER: ${{ secrets.SERVER_USER || 'deploy' }}
          REMOTE_PORT: ${{ secrets.SERVER_PORT || '2348' }}
          TARGET: "/var/www/html/games/big-bad-chicken"
          ARGS: "-rlgoDzvc -i --delete"
          EXCLUDE: "/.git/, /.github/, /node_modules/, *.md, package.json"
          SCRIPT_BEFORE: |
            mkdir -p /var/www/html/games/big-bad-chicken
          SCRIPT_AFTER: |
            chmod -R 755 /var/www/html/games/big-bad-chicken

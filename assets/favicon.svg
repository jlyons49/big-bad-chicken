<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#c2410c" stroke-width="2.5"/>
  <!-- Chicken Comb -->
  <path d="M22 17 C19 10, 26 8, 28 13 C31 7, 39 8, 38 14 C42 10, 48 13, 44 19 Z" fill="#dc2626" filter="url(#shadow)"/>
  <!-- Chicken Body / Head -->
  <circle cx="32" cy="35" r="19" fill="#ffffff" filter="url(#shadow)"/>
  <ellipse cx="32" cy="38" rx="16" ry="14" fill="#f8fafc"/>
  <!-- Angry / Fierce Eyebrows -->
  <path d="M22 26 L30 29" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <path d="M42 26 L34 29" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="26" cy="32" r="4.5" fill="#1e293b"/>
  <circle cx="25" cy="31" r="1.5" fill="#ffffff"/>
  <circle cx="38" cy="32" r="4.5" fill="#1e293b"/>
  <circle cx="37" cy="31" r="1.5" fill="#ffffff"/>
  <!-- Beak -->
  <path d="M27 34 L37 34 L32 44 Z" fill="#eab308" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Wattle -->
  <path d="M30 43 C29 48, 35 48, 34 43 Z" fill="#ef4444"/>
</svg>
